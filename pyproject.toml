[project]
name = "agentforge"
version = "0.1.0"
description = "Builds, attacks, scores and patches voice agents for insurance and banking."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "httpx",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "pyyaml",
    "rich",
    "anthropic",
    "openai",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentforge*"]

[tool.setuptools.package-data]
"agentforge.domain.kasko" = ["*.json", "*.md"]
"agentforge.domain.collections" = ["*/*.json", "*/*.md", "briefs/*/*.json", "briefs/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
